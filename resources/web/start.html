<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root {
    --void: #000000;
    --text: #ecebff;
    --muted: #8b8ba7;
    --glass: rgba(20, 20, 34, 0.55);
    --edge: rgba(255, 255, 255, 0.08);
    --a1: #8b5cf6;
    --a1rgb: 139, 92, 246;
    --a2rgb: 34, 211, 238;
    --a2: #22d3ee;
  }
  body.orbit { --a1: #d946ef; --a2: #8b5cf6; --a1rgb: 217, 70, 239; --a2rgb: 139, 92, 246; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--void);
    color: var(--text);
    font-family: "Segoe UI", "Inter", "SF Pro Display", "Ubuntu", system-ui, sans-serif;
    user-select: none;
  }
  canvas { position: fixed; inset: 0; }
  main {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 24px 72px;
    gap: 18px;
  }
  .logo {
    width: 132px; height: 132px;
    filter: drop-shadow(0 0 18px rgba(var(--a1rgb), 0.7))
            drop-shadow(0 0 42px rgba(var(--a2rgb), 0.35));
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }
  h1 {
    margin: 0;
    font-weight: 300;
    font-size: 44px;
    letter-spacing: 0.55em;
    padding-left: 0.55em;
    color: #ffffff;
  }
  .greeting { color: var(--muted); font-size: 15px; letter-spacing: 0.04em; margin-top: -6px; }
  .greeting b { color: var(--text); font-weight: 600; }

  form {
    width: min(640px, 92vw);
    margin-top: 10px;
    position: relative;
    border-radius: 30px;
    padding: 1.5px;
    background: linear-gradient(90deg, var(--edge), var(--edge));
    transition: background .25s;
  }
  form:focus-within { background: linear-gradient(90deg, var(--a1), var(--a2)); box-shadow: 0 0 40px -8px var(--a1); }
  .field {
    display: flex; align-items: center; gap: 12px;
    background: rgba(12, 12, 22, 0.92);
    border-radius: 29px;
    padding: 0 22px;
    height: 56px;
    backdrop-filter: blur(16px);
  }
  .field svg { flex: none; opacity: .7; }
  input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0;
    color: var(--text);
    font: inherit; font-size: 17px;
  }
  input::placeholder { color: #6f6f8c; }
  kbd {
    font: 12px ui-monospace, monospace; color: var(--muted);
    border: 1px solid var(--edge); border-radius: 6px; padding: 2px 7px;
  }

  .tiles {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 506px;
    gap: 14px;
    margin-top: 22px;
  }
    .tile {
    width: 112px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 8px 12px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--edge);
    color: var(--text);
    text-decoration: none;
    font-size: 12.5px;
    backdrop-filter: blur(12px);
    transition: transform .18s ease, border-color .18s, background .18s;
  }
  .tile:hover {
    transform: translateY(-4px);
    border-color: rgba(var(--a1rgb), 0.6);
    background: rgba(30, 26, 52, 0.7);
  }
  .logo-orb {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center;
    background: #ffffff;
    box-shadow: 0 6px 18px -6px rgba(255, 255, 255, 0.25);
    overflow: hidden;
  }
  .logo-orb img { width: 32px; height: 32px; }
  .orb {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #fff;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 0 18px -4px var(--glow);
  }
  .tile span { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 22px;
    color: var(--muted); font-size: 12.5px;
  }
  footer .pill {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 99px;
    background: var(--glass); border: 1px solid var(--edge);
  }
  footer .pill b { color: var(--a2); }
  .orbit-banner {
    display: none;
    padding: 8px 16px; border-radius: 99px;
    background: rgba(217, 70, 239, 0.12); border: 1px solid rgba(217, 70, 239, 0.35);
    color: #f5d0fe; font-size: 13px;
  }
  body.orbit .orbit-banner { display: block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <img class="logo" src="kepler://assets/logo.png" alt="">
  <h1>KEPLER</h1>
  <div class="greeting" id="greeting"></div>
  <div class="orbit-banner">&#x1FA90; Orbit mode &mdash; nothing you do in this window is saved</div>
  <form id="search" autocomplete="off">
    <div class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8b8d0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="q" spellcheck="false">
      <kbd>/</kbd>
    </div>
  </form>
  <div class="tiles" id="tiles"></div>
</main>
<footer>
  <div class="pill" id="shields"></div>
  <div class="pill" id="clock"></div>
</footer>

<script>
const DATA = {{DATA}};

if (DATA.orbit) document.body.classList.add('orbit');

// ---------- search ----------
const q = document.getElementById('q');
q.placeholder = `Search with ${DATA.engine} or enter an address`;
document.getElementById('search').addEventListener('submit', e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) location.href = text;
  else if (!/\s/.test(text) && /^[^.]+\.[^.]+/.test(text)) location.href = 'https://' + text;
  else location.href = DATA.search.replace('%1', encodeURIComponent(text));
});
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

// ---------- tiles ----------
const tiles = document.getElementById('tiles');
for (const t of DATA.tiles) {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = t.url;
  let hash = 0;
  for (const ch of t.url) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = hash % 360;
  // A colored letter first; swapped for the site's real logo once it loads.
  const orb = document.createElement('div');
  orb.className = 'orb';
  orb.style.background = `radial-gradient(circle at 30% 25%, hsl(${hue} 90% 72%), hsl(${(hue + 40) % 360} 70% 38%))`;
  orb.style.setProperty('--glow', `hsl(${hue} 90% 60%)`);
  orb.textContent = (t.title || t.url).trim().charAt(0).toUpperCase();
  const img = new Image();
  img.alt = '';
  img.onload = () => {
    orb.className = 'logo-orb';
    orb.removeAttribute('style');
    orb.textContent = '';
    orb.append(img);
  };
  img.src = t.icon;
  const label = document.createElement('span');
  label.textContent = t.title || t.url;
  a.append(orb, label);
  tiles.append(a);
}

// ---------- clock & greeting ----------
function tick() {
  const now = new Date();
  const h = now.getHours();
  const part = h < 5 ? 'Stargazing late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').innerHTML = `${part}, <b>explorer</b>`;
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' · ' +
    now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
}
tick();
setInterval(tick, 10000);

document.getElementById('shields').innerHTML = DATA.shields
  ? `&#x1F6E1;&#xFE0F; Shields up &middot; <b>${DATA.blocked}</b> trackers blocked`
  : '&#x1F6E1;&#xFE0F; Shields are down';

// ---------- shooting stars ----------
const sky = document.getElementById('sky');
const ctx = sky.getContext('2d');
let W, H, meteors = [];

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  sky.width = W * dpr; sky.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function launch() {
  const speed = 7 + Math.random() * 6;
  meteors.push({
    x: W * (0.25 + Math.random() * 0.85),
    y: -20 + Math.random() * H * 0.45,
    vx: -speed, vy: speed * (0.35 + Math.random() * 0.2),
    len: 110 + Math.random() * 120,
    life: 1,
    hue: Math.random() < 0.3 ? (Math.random() < 0.5 ? 265 : 190) : 0,
  });
}

let next = 600;
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  if (t > next) {
    launch();
    next = t + 900 + Math.random() * 2600;
  }
  for (const m of meteors) {
    const k = Math.hypot(m.vx, m.vy);
    const tx = m.x - (m.vx / k) * m.len, ty = m.y - (m.vy / k) * m.len;
    const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    const head = m.hue ? `hsla(${m.hue}, 90%, 82%, ${m.life})` : `rgba(255,255,255,${m.life})`;
    g.addColorStop(0, head);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = head;
    ctx.beginPath(); ctx.arc(m.x, m.y, 1.4, 0, Math.PI * 2); ctx.fill();
    m.x += m.vx; m.y += m.vy; m.life -= 0.012;
  }
  meteors = meteors.filter(m => m.life > 0 && m.x > -300 && m.y < H + 300);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
