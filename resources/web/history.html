<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<style>
  :root { --a1: #8b5cf6;
    --a1rgb: 139, 92, 246;
    --a2rgb: 34, 211, 238; --a2: #22d3ee; --muted: #8b8ba7; --edge: #23233a; }
  body.orbit { --a1: #d946ef; --a2: #8b5cf6; --a1rgb: 217, 70, 239; --a2rgb: 139, 92, 246; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(60% 40% at 50% 0%, rgba(var(--a1rgb), 0.14), transparent), #07070c;
    background-attachment: fixed;
    color: #ecebff;
    font-family: "Segoe UI", "Inter", "Ubuntu", system-ui, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  header img { width: 52px; height: 52px; filter: drop-shadow(0 0 14px var(--a1)); }
  h1 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: .2em; }
  input {
    width: 100%;
    background: #0e0e18; border: 1px solid var(--edge); border-radius: 14px;
    color: inherit; font: inherit; font-size: 15px;
    padding: 13px 16px; outline: 0; margin-bottom: 24px;
  }
  input:focus { border-color: var(--a1); box-shadow: 0 0 30px -10px var(--a1); }
  h2 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .18em;
    color: var(--a2); margin: 28px 0 8px;
  }
  a.row {
    display: grid; grid-template-columns: 70px 1fr auto; gap: 14px; align-items: center;
    padding: 10px 14px; border-radius: 12px;
    color: inherit; text-decoration: none;
  }
  a.row:hover { background: #14141f; }
  .time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host { color: var(--muted); font-size: 12.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="kepler://assets/logo.png" alt="">
    <h1>HISTORY</h1>
  </header>
  <input id="filter" placeholder="Search history" autofocus spellcheck="false">
  <div id="list"></div>
</div>
<script>
const DATA = {{DATA}};
if (DATA.orbit) document.body.classList.add('orbit');

const list = document.getElementById('list');

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const that = new Date(d); that.setHours(0, 0, 0, 0);
  const diff = Math.round((today - that) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return that.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

function render(filter) {
  list.textContent = '';
  const f = filter.toLowerCase();
  let lastDay = null, count = 0;
  for (const it of DATA.items) {
    if (f && !it.t.toLowerCase().includes(f) && !it.u.toLowerCase().includes(f)) continue;
    const label = dayLabel(it.d);
    if (label !== lastDay) {
      const h = document.createElement('h2');
      h.textContent = label;
      list.append(h);
      lastDay = label;
    }
    const a = document.createElement('a');
    a.className = 'row';
    a.href = it.u;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date(it.d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = it.t || it.u;
    const host = document.createElement('span');
    host.className = 'host';
    try { host.textContent = new URL(it.u).host; } catch { host.textContent = ''; }
    a.append(time, title, host);
    list.append(a);
    if (++count >= 600) break;
  }
  if (!count) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = DATA.orbit ? 'Orbit mode keeps no history.' : (f ? 'Nothing found in your travels.' : 'No history yet. Go explore!');
    list.append(e);
  }
}
document.getElementById('filter').addEventListener('input', e => render(e.target.value));
render('');
</script>
</body>
</html>
