name: Fetch AI logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-logos.yml']

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download logos
        run: |
          mkdir -p resources/ai
          fetch() {
            curl -fsSL -A "Mozilla/5.0" -o "resources/ai/$1.png" \
              "https://www.google.com/s2/favicons?sz=128&domain=$2"
            file "resources/ai/$1.png"
          }
          fetch claude claude.ai
          fetch chatgpt chatgpt.com
          fetch gemini gemini.google.com
          fetch copilot copilot.microsoft.com
          fetch perplexity www.perplexity.ai

      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add resources/ai
          git diff --cached --quiet || git commit -m "Add AI assistant logos [skip ci]"
          git push
