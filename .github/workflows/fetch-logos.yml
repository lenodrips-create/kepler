name: Fetch AI logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-logos.yml']

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download logos
        run: |
          mkdir -p resources/ai
          # Try the biggest logo first, then smaller sizes and other addresses.
          fetch() {
            name=$1; shift
            for domain in "$@"; do
              for size in 128 96 64; do
                if curl -fsSL -A "Mozilla/5.0" -o "resources/ai/$name.png" \
                     "https://www.google.com/s2/favicons?sz=$size&domain=$domain"; then
                  file "resources/ai/$name.png"
                  return 0
                fi
              done
            done
            echo "::error::no logo found for $name"
            return 1
          }
          fetch claude claude.ai anthropic.com
          fetch chatgpt chatgpt.com openai.com
          fetch gemini gemini.google.com
          fetch copilot copilot.microsoft.com copilot.cloud.microsoft bing.com
          fetch perplexity www.perplexity.ai perplexity.ai

      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add resources/ai
          git diff --cached --quiet || git commit -m "Add AI assistant logos [skip ci]"
          git push
