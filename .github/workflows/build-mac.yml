name: Build Kepler for Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Make Mac icon
        run: |
          mkdir kepler.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s resources/logo-icon.png --out kepler.iconset/icon_${s}x${s}.png
            d=$((s*2))
            sips -z $d $d resources/logo-icon.png --out kepler.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns kepler.iconset -o resources/kepler.icns

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j3

      - name: Package
        run: |
          macdeployqt build/Kepler.app -always-overwrite
          codesign --force --deep --sign - build/Kepler.app
          mkdir dist
          ditto -c -k --keepParent build/Kepler.app dist/Kepler-mac-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kepler-mac-${{ matrix.arch }}
          path: dist/*.zip

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kepler (latest build)
          body: |
            Download the zip for your Mac, double-click it, then drag Kepler into Applications.
            - **Intel Mac** -> Kepler-mac-intel.zip
            - **M1/M2/M3/M4 Mac** -> Kepler-mac-apple-silicon.zip
            First launch: right-click Kepler -> Open -> Open.
          files: dist/*.zip
          make_latest: true
